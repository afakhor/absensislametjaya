name: Build APK + IPA TB Slamet Jaya

on:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Clean total + Fix opus & blue_plus
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ~/.pub-cache/hosted/pub.dev/flutter_blue_plus*
          rm -rf /home/runner/.pub-cache/hosted/pub.dev/flutter_blue_plus*
          flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Absensi-TB-Slamet-Jaya-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build IPA tanpa signing
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Clean total + Pod Fix + Fix AppDelegate
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Runner/SceneDelegate.swift
          rm -rf ~/.pub-cache/hosted/pub.dev/flutter_blue_plus*
          
          # TIMPA AppDelegate.swift yang error jadi versi baru
          cat > ios/Runner/AppDelegate.swift <<'EOF'
          import Flutter
          import UIKit

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          EOF

          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          cd ios
          pod cache clean --all
          pod deintegrate
          pod install --repo-update
          cd ..

      - name: Build IPA no-codesign
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons
          mkdir -p build/ios/ipa
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release archive -archivePath build/ios/Runner.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -sdk iphoneos
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r TB-SLAMET-JAYA-unsigned.ipa Payload
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: Absensi-TB-Slamet-Jaya-IPA-Unsigned
          path: build/ios/ipa/TB-SLAMET-JAYA-unsigned.ipa