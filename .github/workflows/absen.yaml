name: Build APK TB Slamet Jaya
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8' # FIX: upgrade dari 3.22.2
          channel: 'stable'

      - name: Clean old flutter_blue_plus cache
        run: |
          rm -rf /home/runner/.pub-cache/hosted/pub.dev/flutter_blue_plus*
          rm -rf android/.gradle
          flutter clean

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: Absensi-TB-Slamet-Jaya-APK
          path: build/app/outputs/flutter-apk/app-release.apk